[package]
name = "jokoway"
version = "0.1.0-rc.1"
edition = "2024"
description = "Jokoway is a high-performance API Gateway built on Pingora (Rust) with dead-simple YAML configs."
readme = "../README.md"
repository = "https://github.com/hijriyan/jokoway"
license = "MIT"

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
boring = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
env_logger = { workspace = true }
flate2 = { workspace = true }
hickory-resolver = { workspace = true }
http = { workspace = true }
jokoway-core = { path = "../jokoway-core", version = "0.1.0-rc.1" }
jokoway-rules = { path = "../jokoway-rules", version = "0.1.0-rc.1" }
jokoway-transformer = { path = "../jokoway-transformer", version = "0.1.0-rc.1" }
log = { workspace = true }
pingora = { workspace = true }
rcgen = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
x509-parser = { workspace = true }

axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# optional dependencies
jokoway-acme = { path = "../jokoway-acme", version = "0.1.0-rc.1", optional = true }
jokoway-compress = { path = "../jokoway-compress", version = "0.1.0-rc.1", optional = true }
jokoway-forwarded = { path = "../jokoway-forwarded", version = "0.1.0-rc.1", optional = true }
matchit = { workspace = true }
tower_governor = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
utoipa-swagger-ui = { workspace = true, optional = true }

[dev-dependencies]
futures-util = "0.3.31"
pingora = "0.8.0"
reqwest = { version = "0.13.2", features = ["json"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-boring = "4"
tokio-tungstenite = "0.28.0"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6.5"

[features]
default = ["acme", "api", "compress", "forwarded"]
acme = ["dep:jokoway-acme"]
acme_tests = ["acme", "jokoway-acme/pebble_tests"]
api = [
  "dep:axum",
  "dep:base64",
  "dep:tower_governor",
  "dep:utoipa",
  "dep:utoipa-swagger-ui",
  "jokoway-core/api",
]
compress = ["compress-brotli", "compress-zstd", "dep:jokoway-compress"]
compress-brotli = ["jokoway-compress/brotli"]
compress-zstd = ["jokoway-compress/zstd"]
forwarded = ["dep:jokoway-forwarded"]
